# PA-AI-2 Unified Configuration
# Base configuration for all environments

metadata:
  version: "1.0.0"
  generated_at: "2024-12-19T00:00:00Z"
  description: "Unified configuration for PA-AI-2 Generative Module"

# Global settings
global:
  debug: false
  log_level: "INFO"
  max_workers: 4
  timeout: 300
  cache_enabled: true
  
# Service configurations
services:
  classifier:
    model_type: "remi"
    device: "cpu"
    batch_size: 32
    vocab_size: 1382
    lstm_hidden_dim: 128
    embedding_size: 300
    context_size: 512
    dropout: 0.0
    learning_rate: 0.0001
    weight_decay: 0.0001
    
  encoder:
    resolution: 480
    pos_per_quarter: 12
    max_bars: 512
    velocity_bins: 32
    tempo_bins: 32
    batch_size: 16
    
  feature_extraction:
    symbolic_features_enabled: true
    vae_enabled: true
    latent_dim: 128
    batch_size: 32
    learning_rate: 0.001
    
  generator:
    d_model: 512
    d_latent: 1024
    context_size: 512
    max_positions: 2048
    encoder_layers: 6
    decoder_layers: 12
    attention_heads: 8
    temperature: 0.8
    
  multimodal_mapping:
    image_dim: 384
    text_dim: 384
    fusion_dim: 512
    hidden_dim: 512
    latent_dim: 128
    output_dim: 256
    
  music_base:
    synthesis_enabled: true
    chord_extraction_enabled: true
    key_extraction_enabled: true
    
  dataloader:
    dataset_name: "EMOPIA"
    max_sequence_length: 1024
    shuffle: true
    num_workers: 2
    pin_memory: true
    
  pseudo_labeller:
    clip_model: "ViT-B/32"
    batch_size: 8
    device: "cpu"

# Pipeline configurations
pipelines:
  training:
    parallel_execution: false
    job_priority: "normal"
    checkpoint_interval: 500
    validation_interval: 100
    
  inference:
    parallel_execution: true
    job_priority: "high"
    batch_processing: true
    
# Job management
job_management:
  max_concurrent_jobs: 10
  job_timeout: 3600
  retry_attempts: 3
  queue_size: 100
  
# Paths configuration
paths:
  root_output: "output"
  datasets_path: "datasets"
  checkpoints_path: "output/checkpoints"
  generated_path: "output/generated"
  logs_path: "output/logs"
  
# Resource limits
resources:
  memory_limit: "8GB"
  cpu_cores: 4
  gpu_memory: "4GB"
  disk_space: "50GB" 