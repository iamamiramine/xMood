metadata:
  environment: development
  description: "Development environment configuration with debug settings and relaxed constraints"
  version: "1.0"
  
global:
  device: "cpu"  # Use CPU for local development
  seed: 42
  debug: true
  log_level: "DEBUG"
  output_root: "output/dev/"
  checkpoints_root: "checkpoints/dev/"
  logs_root: "logs/dev/"
  
data:
  # Smaller datasets for faster development
  batch_size: 4
  max_bars: 32
  max_contexts_per_file: 10
  num_workers: 1
  pin_memory: false
  
services:
  classifier:
    debug: true
    model_size: "small"
    training:
      max_epochs: 5
      patience: 3
      
  encoder:
    debug: true
    vocab_size: 1000  # Smaller vocab for faster processing
    
  generator:
    debug: true
    sample_size: 10
    max_generation_steps: 50
    
  feature_extraction:
    debug: true
    extract_all_features: false
    
  multimodal_mapping:
    debug: true
    embedding_dim: 256
    
  music_base:
    debug: true
    
  dataloader:
    debug: true
    cache_size: 100
    
  pseudo_labeller:
    debug: true
    
pipeline:
  training:
    save_every_n_steps: 10
    validate_every_n_steps: 5
    
  inference:
    timeout: 30  # seconds
    
job_management:
  max_concurrent_jobs: 2
  job_timeout: 300  # 5 minutes
  
resource_limits:
  memory_limit: "4GB"
  cpu_limit: 2
  
paths:
  datasets: "datasets/"
  models: "models/dev/"
  temp: "temp/dev/" 