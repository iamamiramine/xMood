metadata:
  environment: staging
  description: "Staging environment configuration with production-like settings and enhanced monitoring"
  version: "1.0"
  
global:
  device: "cuda"  # Use GPU for staging
  seed: 42
  debug: false
  log_level: "INFO"
  output_root: "output/staging/"
  checkpoints_root: "checkpoints/staging/"
  logs_root: "logs/staging/"
  
data:
  # Production-like datasets but smaller
  batch_size: 16
  max_bars: 256
  max_contexts_per_file: 100
  num_workers: 4
  pin_memory: true
  
services:
  classifier:
    debug: false
    model_size: "medium"
    training:
      max_epochs: 20
      patience: 5
      
  encoder:
    debug: false
    vocab_size: 1382  # Standard vocab size
    
  generator:
    debug: false
    sample_size: 50
    max_generation_steps: 256
    
  feature_extraction:
    debug: false
    extract_all_features: true
    
  multimodal_mapping:
    debug: false
    embedding_dim: 512
    
  music_base:
    debug: false
    
  dataloader:
    debug: false
    cache_size: 1000
    
  pseudo_labeller:
    debug: false
    
pipeline:
  training:
    save_every_n_steps: 100
    validate_every_n_steps: 50
    
  inference:
    timeout: 120  # seconds
    
job_management:
  max_concurrent_jobs: 8
  job_timeout: 1800  # 30 minutes
  
resource_limits:
  memory_limit: "16GB"
  cpu_limit: 8
  
paths:
  datasets: "datasets/"
  models: "models/staging/"
  temp: "temp/staging/"
  
# Staging-specific settings
staging_settings:
  enhanced_monitoring: true
  detailed_logging: true
  performance_profiling: true
  error_reporting: true 