metadata:
  environment: production
  description: "Production environment configuration with optimized settings for performance and reliability"
  version: "1.0"
  
global:
  device: "cuda"  # Use GPU for production
  seed: 42
  debug: false
  log_level: "WARNING"
  output_root: "output/prod/"
  checkpoints_root: "checkpoints/prod/"
  logs_root: "logs/prod/"
  
data:
  # Full production datasets
  batch_size: 32
  max_bars: 512
  max_contexts_per_file: -1  # No limit
  num_workers: 8
  pin_memory: true
  
services:
  classifier:
    debug: false
    model_size: "large"
    training:
      max_epochs: 100
      patience: 10
      
  encoder:
    debug: false
    vocab_size: 1382  # Standard vocab size
    
  generator:
    debug: false
    sample_size: 100
    max_generation_steps: 512
    
  feature_extraction:
    debug: false
    extract_all_features: true
    
  multimodal_mapping:
    debug: false
    embedding_dim: 1024
    
  music_base:
    debug: false
    
  dataloader:
    debug: false
    cache_size: 10000
    
  pseudo_labeller:
    debug: false
    
pipeline:
  training:
    save_every_n_steps: 1000
    validate_every_n_steps: 500
    
  inference:
    timeout: 300  # 5 minutes
    
job_management:
  max_concurrent_jobs: 16
  job_timeout: 3600  # 1 hour
  
resource_limits:
  memory_limit: "32GB"
  cpu_limit: 16
  
paths:
  datasets: "datasets/"
  models: "models/prod/"
  temp: "temp/prod/"
  
# Production-specific settings
production_settings:
  high_availability: true
  auto_scaling: true
  backup_enabled: true
  monitoring_enabled: true
  security_hardening: true 